<!DOCTYPE html>
<html>

<head>
    <title>YourSound</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" href="/assets/images/icons/favicon.svg">
</head>

<body>
    <nav>
        <a href="/" class="home clear-link">
            <img src="/assets/images/icons/logo.svg">
            <div>YourSound</div>
        </a>

    </nav>
    <section>
        <div class="edit-elements form-flex">
          <h1 class="title">Profile info</h1>
          <form id="editAccountForm" class="system-UI form-flex">
    
            <div class="form-flex">
                <div>
                </div>
                <div class="form-input-area" id="profile-image">
                    <label for="profile" class="sub-title">Profile picture:</label>
                    <div class="fileUploadInput">
                        <label for="profile" class="system-UI-accent WhiteButton FakeUploadButton">Upload profile
                            picture</label>
                        <input type="file" id="profile" name="profile">
                    </div>
                </div>
        
            </div>
    
            <div class="form-flex">
                <div class="form-input-area">
                    <label for="username" class="sub-title">Username:</label>
                    <input type="text" id="username" name="username" class="system-UI-accent" placeholder="username">
                </div>
                <div class="form-input-area">
                    <label for="password" class="sub-title">Password:</label>
                    <input type="password" id="password" name="password" placeholder="pass">
                </div>
                <div class="error-note"></div>
            </div>
                    <div class="edit-actions">
              <button type="button" id="CancelCreateButton" class="SecondaryOrangeButton system-UI-accent">Cancel</button>
              <button type="submit" id="SaveChangesPlaylistButton" class="OrangeButton system-UI-accent">Save changes</button>
            </div>
    
          </form>
        </div>
    
    
    
      </section>
    
    <footer>
        <div>
            <p class="sub-title">Digital design och utveckling III</p>
            <p class="sub-title">Projekt, Grupp 5</p>
            <p class="sub-title">&copy; 2026</p>
        </div>
        <div>
            <p class="sub-title">Developers</p>
            <p class="text">Cornelia Rönnemyr Papic</p>
            <p class="text">Dilara Kinali</p>
            <p class="text">Elena Khusanova</p>
        </div>
    </footer>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/edit.js"></script>
</body>
</html>
