<!DOCTYPE html>
<html>

<head>
    <title>YourSound</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" href="/assets/images/icons/favicon.svg">
</head>

<body>
    <nav>
        <a href="/welcome" class="home clear-link">
            <img src="/assets/images/icons/logo.svg">
              <div>YourSound</div>
          </a>
      
    </nav>
    <section class="Welcome">
        <div class="title">Welcome to YourSound</div>
       <!--  <form id="image-upload" class="system-UI">
           <button type="submit" class="ActionButton-light">Use this image for profile</button>
           
           <div class="error-note"></div>
        </form> -->
        <form id="signup" class="system-UI">
            <div class="form-input-area" id="profile-image">
                <label for="profile" class="sub-title">Profile picture:</label>
                <input type="file" id="profile" name="profile">
            </div>
            <div class="form-input-area">
                <label for="username" class="sub-title">Username:</label>
                <input type="text" id="username" name="username" class="system-UI-accent">
            </div>
            <div class="form-input-area">
                <label for="password" class="sub-title">Password:</label>
                <input type="password" id="password" name="password">
            </div>
            <div class="error-note"></div>

            <button type="submit" class="ActionButton-light">Sign up</button>
        </form>
        <div>
            <p class="sub-title">Already a member? <a href="/login">Log in</a></p>
        </div>
    </section>

    <footer>
        <div>
          <p class="sub-title">Digital design och utveckling III</p>
          <p class="sub-title">Projekt, Grupp 5</p>
          <p class="sub-title">&copy; 2026</p>
        </div>
        <div>
          <p class="sub-title">Developers</p>
          <p class="text">Cornelia Rönnemyr Papic</p>
          <p class="text">Dilara Kinali</p>
          <p class="text">Elena Khusanova</p>
        </div>
      </footer>
            <script src="/assets/js/signup.js"></script>
</body>

</html>
