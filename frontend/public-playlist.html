<!DOCTYPE html>
<html>

<head>
  <title>YourSound</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/images/icons/favicon.svg">
</head>

<body>

  <nav>
    <a href="/" class="home clear-link">
      <img src="/assets/images/icons/logo.svg">
      <div>YourSound</div>
    </a>
    <div class="space"></div>
    <button class="LikePlaylist-Button BlackLike system-UI-accent">
      <span></span>
    </button>
    <button class="SongToPlaylist-Button BlackButton system-UI-accent">
      <span>Add song</span>
    </button>
  </nav>

  <section id="PublicPlaylist" class="playlist-content">
    <div class="PlaylistData edit-elements">
      <div class="info">
        <img src="" alt="">
        <h1 id="PlaylistName" class="title">playlist name</h1>
        <p id="PlaylistDescription" class="system-UI">description</p>
        <p id="PlaylistTag" class="system-UI-accent">tag</p>
      </div>
      <div class="songs">
        <h1 class="title">Songs in playlist</h1>
        <ul class="system-UI" id="addedSongsList">
        </ul>
      </div>
      <div class="edit-actions">

      </div>

    </div>
    <div id="AddSong" class="edit-elements">
      <h1 class="title">Add song to playlist</h1>
      <form id="AddSongForm" class="SearchSongElement">
        <input type="search" name="SearchSongInput" id="SearchSongInput" class="system-UI" placeholder="Search song">
        <button class="ButtonSearchSong" type="submit"></button>
      </form>
      <div id="SearchResultSongs" class="system-UI">
        <ul>
        </ul>
      </div>
    </div>

  </section>

  <footer>
    <div>
      <p class="sub-title">Digital design och utveckling III</p>
      <p class="sub-title">Projekt, Grupp 5</p>
      <p class="sub-title">&copy; 2026</p>
    </div>
    <div>
      <p class="sub-title">Developers</p>
      <p class="text">Cornelia Rönnemyr Papic</p>
      <p class="text">Dilara Kinali</p>
      <p class="text">Elena Khusanova</p>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/playlist.js"></script>
</body>

</html>
