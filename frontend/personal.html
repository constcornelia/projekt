<!DOCTYPE html>
<html>

<head>
  <title>YourSound</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/images/icons/favicon.svg">
</head>

<body>

  <nav>
    <a href="/" class="home clear-link">
      <img src="/assets/images/icons/logo.svg">
      <div>YourSound</div>
    </a>
    <div class="space"></div>
    <a href="/edit" class="SecondaryBlackButton system-UI-accent clear-link">Edit account</a>
  </nav>

  <section id="profile-header">
    <img id="ProfilePicture" class="profile-picture" src="">
    <h1 class="title-UI"></h1>
  </section>

  <section id="PersonalPlaylistsCollection">
    <a href="/new-playlist" class="clear-link">
      <div id="CreatePlaylistLink" class="add-playlist-card system-UI-accent">
        <img src="/assets/images/icons/add.svg">
        <p class="system-UI-accent">Create new playlist</p>
      </div>
    </a>

    <section class="playlist-category">
      <h2 class="title-UI">Liked</h2>
      <div id="LikedPlaylistsCollection" class="playlists-container"></div>
    </section>

    <section class="playlist-category">
      <h2 class="title-UI">Owned</h2>
      <div id="OwnedPlaylistsCollection" class="playlists-container"></div>
    </section>

    <section class="playlist-category">
      <h2 class="title-UI">Edited</h2>
      <div id="EditedPlaylistsCollection" class="playlists-container"></div>
    </section>

  </section>



  <footer>
    <div>
      <p class="sub-title">Digital design och utveckling III</p>
      <p class="sub-title">Projekt, Grupp 5</p>
      <p class="sub-title">&copy; 2026</p>
    </div>
    <div>
      <p class="sub-title">Developers</p>
      <p class="text">Cornelia Rönnemyr Papic</p>
      <p class="text">Dilara Kinali</p>
      <p class="text">Elena Khusanova</p>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/personal.js"></script>
</body>

</html>
