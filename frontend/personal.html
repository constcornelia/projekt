<!DOCTYPE html>
<html>

<head>
  <title>YourSound</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <nav>
      <a href="/" class="home clear-link">
        <img src="/assets/images/icons/logo.svg">
          <div>YourSound</div>
      </a>
      <div class="space">
        <form action="" id="SearchPaylistForm" class="system-UI">
          <input type="search" name="SearchInput" id="SearchInput" placeholder="Search by playlist name, owner or genre">
          <button id="ButtonSearch" type="submit"></button>
        </form>
      </div>
      <a href="/edit.html" class="SecondaryButton system-UI-accent clear-link">Edit account</a>
    </nav>
  
    <section id="filters">
      <h1 class="title-UI">Find your best playlist</h1>
  
        <form class="FilterForm system-UI">
          <div>
            <div class="Select">
              <select id="SelectGenre"  name="genre">
                <option value="">Select tag</option>
                <option value="ShowAll">all</option>
              </select>
            </div>
            <label class="Sort-Playlists" for="Sort-Liked-playlists">Most popular playlists
              <input type="radio" id="Sort-Liked-playlists" name="Sort-Liked-playlists"  value="Sort-Liked-playlists">
            </label>
          </div>
          <div>
            <button id="FiltersSubmit" type="submit" class="system-UI">Sort playlists</button>
            <button id="FiltersReset" type="reset" class="system-UI">Clear filters</button>
          </div>
  
    
      </form>
  
    </section>
  
<section id="PersonalPlaylistsCollection">
    <div class="add-playlist-card">
      <a href="/new-playlist" id="CreatePlaylistLink" class="CreatePlaylist-Button system-UI-accent">Create new playlist</a>
    </div>

    <a href="/profile/playlists" class="clear-link">
      <div class="playlist-card">
        <h1 class="title-UI">Bohemian Rhapsody
        </h1>
        <div class="playlist-actions">
          <button class="LikePlaylist-Button system-UI"><span>ff</span></button>
          <button class="Play StopPlaying"></button>
        </div>
        <p class="system-UI-accent">tags</p>
        <img src="/assets/images/Bohemian_Rhapsody_poster.png">
      </div>
    </a>
    
    </section>



  <footer>
    <div>
      <p class="sub-title">Digital design och utveckling III</p>
      <p class="sub-title">Projekt, Grupp 5</p>
      <p class="sub-title">&copy; 2026</p>
    </div>
    <div>
      <p class="sub-title">Developers</p>
      <p class="text">Cornelia Rönnemyr Papic</p>
      <p class="text">Dilara Kinali</p>
      <p class="text">Elena Khusanova</p>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/personal.js"></script>
</body>

</html>
