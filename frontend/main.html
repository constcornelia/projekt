<!DOCTYPE html>
<html>

<head>
  <title>YourSound</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/images/icons/favicon.svg">
</head>

<body>
  <!--sektionen med osynliga elementer som ska visas efter klick-->
  <section class="hidden-elements">
    <!--osynlig nu ska visas när låt aderas listener på add song knappen-->
    <div id="AlertDeleteSong" class="edit-elements pop-up">
      <h1 class="title">the song</h1>
      <div class="pop-up-action system-UI-accent">
        <p class="text">Delete from playlist?</p>
        <div>
          <button id="UndoDeleteSong" type="reset" class="WhiteButton system-UI-accent">Undo</button>
          <button id="ConfirmDeleteSong" type="submit" class="WhiteButton system-UI-accent">OK</button>
        </div>
      </div>
    </div>
    <!--osynlig nu ska visas när låt aderas
    listener på add song knappen-->
    <div id="AlertAddSong" class="edit-elements pop-up">
      <h1 class="title">song name</h1>
      <div class="pop-up-action system-UI-accent">
        <p>is added to your playlist</p>
        <div>
          <button id="UndoAddSong" type="button" class="WhiteButton">Undo</button>
          <button id="ConfirmAddSong" type="button" class="WhiteButton">OK</button>
        </div>
      </div>
    </div>
    <!--osynlig nu ska visas när liked-->
    <div id="AlertLikePlaylist" class="edit-elements pop-up">
      <h1 class="title">playlist name</h1>
      <div class="pop-up-action system-UI-accent">
        <p> is added to your liked playlist</p>
        <div>
          <button id="UndoLike" type="button" class="WhiteButton">Undo</button>
          <button id="ConfirmLike" type="button" class="WhiteButton">OK</button>
        </div>
      </div>
    </div>

  </section>
<!--ta bort om inte använder för slutversion-->


  <nav>
    <a href="/" class="home clear-link">
      <img src="/assets/images/icons/logo.svg">
      <div>YourSound</div>
    </a>
    <div class="space">
      <form action="" id="SearchPaylistForm">
        <input type="search" name="SearchInput" id="SearchInput" class="system-UI"
          placeholder="Search by playlist name, tags or description">
        <button id="ButtonSearch" type="submit"></button>
      </form>
    </div>
    <a id="toPersonal" href="/profile/username" class="BlackButton system-UI-accent clear-link">My collection</a>
  </nav>

  <section id="filters">
    <h1 class="title-UI">Find your best playlist</h1>

    <form class="FilterForm system-UI">
      <div>
        <div class="Select">
          <select id="SelectGenre" class="system-UI" name="genre">
            <option value="">Select tag</option>
          </select>
        </div>
        <label class="Sort-Playlists" for="Sort-Liked-playlists">Most popular playlists
          <input type="radio" id="Sort-Liked-playlists" name="Sort-Liked-playlists" value="Sort-Liked-playlists">
        </label>
      </div>
      <div>
        <button id="FiltersReset" type="reset" class="SecondaryOrangeButton system-UI">Clear filters</button>
        <button id="FiltersSubmit" type="submit" class="OrangeButton system-UI">Sort playlists</button>
      </div>


    </form>

  </section>


  <section id="PublicPlaylistsCollection">

    <a href="/playlists" class="clear-link">
      <div class="playlist-card">
    </a>

  </section>

  <footer>
    <div>
      <p class="sub-title">Digital design och utveckling III</p>
      <p class="sub-title">Projekt, Grupp 5</p>
      <p class="sub-title">&copy; 2026</p>
    </div>
    <div>
      <p class="sub-title">Developers</p>
      <p class="text">Cornelia Rönnemyr Papic</p>
      <p class="text">Dilara Kinali</p>
      <p class="text">Elena Khusanova</p>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/playlists.js"></script>

</body>

</html>
